server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./storage/heatnet;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  application:
    name: heatnet
  servlet:
    multipart:
      # MVP bound; full competition-scale streaming is not claimed.
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0B
springdoc:
  swagger-ui:
    path: /swagger-ui.html
heatnet:
  storage: ${HEATNET_STORAGE:./storage/files}
